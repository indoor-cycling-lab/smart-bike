  <!-- Iconos de google/material-design-icons, estilo Rounded (peso 400, relleno 0, 24 px), con licencia Apache 2.0 (icons-LICENSE.txt).
       Solo los que usa la interfaz o su guía. Para añadir uno: copia su SVG de 24 px como <symbol id="i-nombre"> con el mismo viewBox.
       i-zwift es propio del proyecto (no es de Material ni lleva su licencia) y no imita el logo de Zwift: una «Z» en un recuadro redondeado,
       de un solo <path> relleno con 80 unidades de grosor. i-botones también es propio: los cuatro símbolos de los botones (triángulo, cuadrado,
       círculo y cruz) en cuadrícula 2×2, de un solo <path> relleno con 70 unidades de grosor. i-manillar es propio también: el manillar de bici de
       carretera del Square (barra, dos bajadas en curva que acaban en una punta corta, y puente central corto), de un solo <path> relleno con 80 unidades de grosor. Los ocho i-tecla_* (triángulo, círculo, cuadrado, equis y las cuatro flechas) son propios: los símbolos de las teclas del Square, sin depender de la fuente del sistema.
       Cada uno es de un solo <path> relleno con 80 unidades de grosor y redondeado como i-botones, centrado en la caja de 960, con tamaño óptico parecido (círculo de 600, triángulo de 620, cuadrado de 580, equis de unos 555, flechas de 600 de alto). -->
