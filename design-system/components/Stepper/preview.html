<!-- @dsCard group="Ajustes" height=220 subtitle="Peso del ciclista, incremento por marcha y valor en el máximo" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>Stepper</title></head>
<body>
<div class="sq-w-panel">
  <div class="sq-step"><div class="sq-item__text"><span>Peso del ciclista</span><span class="sq-caption">Para el modelo físico</span></div>
    <div class="sq-step-ctl"><button type="button" aria-label="Restar 1 kg">−</button><span class="sq-step-val">75<span class="sq-unit"> kg</span></span><button type="button" aria-label="Sumar 1 kg">+</button></div></div>
  <div class="sq-step"><div class="sq-item__text"><span>Incremento por marcha</span><span class="sq-caption">Modelo simple</span></div>
    <div class="sq-step-ctl"><button type="button" aria-label="Restar 0,1 %">−</button><span class="sq-step-val">1,0<span class="sq-unit"> %</span></span><button type="button" aria-label="Sumar 0,1 %">+</button></div></div>
  <div class="sq-step"><div class="sq-item__text"><span>Pendiente</span><span class="sq-caption">En el máximo: «+» deshabilitado</span></div>
    <div class="sq-step-ctl"><button type="button" aria-label="Bajar pendiente">−</button><span class="sq-step-val">20,0<span class="sq-unit"> %</span></span><button type="button" aria-label="Subir pendiente" disabled>+</button></div></div>
</div>
</body>
</html>
