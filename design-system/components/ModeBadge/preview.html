<!-- @dsCard group="Rodaje" height=128 subtitle="LIBRE, SIM, ERG manual y ERG de Zwift, y la variante tocable" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>ModeBadge</title></head>
<body>
<div class="sq-pad sq-row">
  <span class="sq-mode libre">LIBRE</span>
  <span class="sq-mode sim">SIM</span>
  <span class="sq-mode erg">ERG <small>MANUAL</small></span>
  <span class="sq-mode erg">ERG <small>ZWIFT</small></span>
</div>
<div class="sq-pad sq-row">
  <button type="button" class="sq-mode libre" aria-label="Modo Libre, toca para pasar a ERG manual">LIBRE</button>
  <button type="button" class="sq-mode sim" aria-label="Modo SIM, toca para pasar a ERG manual">SIM</button>
  <button type="button" class="sq-mode erg" aria-label="Modo ERG manual, toca para volver a Libre">ERG <small>MANUAL</small></button>
  <button type="button" class="sq-mode erg is-pressed" aria-label="Modo ERG de la app">ERG <small>APP</small></button>
</div>
</body>
</html>
