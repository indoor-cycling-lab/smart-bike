<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>SquareKey</title></head>
<body>
<div class="sq-pad sq-col">
  <div class="sq-row">
    <span class="sq-key" role="img" aria-label="triángulo"><svg class="sq-icon" aria-hidden="true"><use href="../../icons.svg#i-tecla_triangulo"/></svg></span><span class="sq-key" role="img" aria-label="círculo"><svg class="sq-icon" aria-hidden="true"><use href="../../icons.svg#i-tecla_circulo"/></svg></span><span class="sq-key" role="img" aria-label="cuadrado"><svg class="sq-icon" aria-hidden="true"><use href="../../icons.svg#i-tecla_cuadrado"/></svg></span><span class="sq-key" role="img" aria-label="equis"><svg class="sq-icon" aria-hidden="true"><use href="../../icons.svg#i-tecla_equis"/></svg></span>
    <span class="sq-key">A</span><span class="sq-key">B</span><span class="sq-key">Y</span><span class="sq-key down">Z</span>
    <span class="sq-key" role="img" aria-label="flecha arriba"><svg class="sq-icon" aria-hidden="true"><use href="../../icons.svg#i-tecla_arriba"/></svg></span><span class="sq-key" role="img" aria-label="flecha abajo"><svg class="sq-icon" aria-hidden="true"><use href="../../icons.svg#i-tecla_abajo"/></svg></span><span class="sq-key" role="img" aria-label="flecha a la izquierda"><svg class="sq-icon" aria-hidden="true"><use href="../../icons.svg#i-tecla_izquierda"/></svg></span><span class="sq-key" role="img" aria-label="flecha a la derecha"><svg class="sq-icon" aria-hidden="true"><use href="../../icons.svg#i-tecla_derecha"/></svg></span>
  </div>
  <div class="sq-row">
    <span class="sq-key down" role="img" aria-label="triángulo"><svg class="sq-icon" aria-hidden="true"><use href="../../icons.svg#i-tecla_triangulo"/></svg></span><span class="sq-key down" role="img" aria-label="círculo"><svg class="sq-icon" aria-hidden="true"><use href="../../icons.svg#i-tecla_circulo"/></svg></span><span class="sq-key down" role="img" aria-label="cuadrado"><svg class="sq-icon" aria-hidden="true"><use href="../../icons.svg#i-tecla_cuadrado"/></svg></span><span class="sq-key down" role="img" aria-label="equis"><svg class="sq-icon" aria-hidden="true"><use href="../../icons.svg#i-tecla_equis"/></svg></span>
    <span class="sq-key down" role="img" aria-label="flecha arriba"><svg class="sq-icon" aria-hidden="true"><use href="../../icons.svg#i-tecla_arriba"/></svg></span><span class="sq-key down" role="img" aria-label="flecha abajo"><svg class="sq-icon" aria-hidden="true"><use href="../../icons.svg#i-tecla_abajo"/></svg></span><span class="sq-key down" role="img" aria-label="flecha a la izquierda"><svg class="sq-icon" aria-hidden="true"><use href="../../icons.svg#i-tecla_izquierda"/></svg></span><span class="sq-key down" role="img" aria-label="flecha a la derecha"><svg class="sq-icon" aria-hidden="true"><use href="../../icons.svg#i-tecla_derecha"/></svg></span>
  </div>
  <div class="sq-row">
    <span class="sq-key wide">Palanca D1</span><span class="sq-key wide">Palanca I2</span><span class="sq-key wide">Freno I</span><span class="sq-key wide">Campag. D</span>
    <span class="sq-key wide">Campag. I</span><span class="sq-plus">+</span><span class="sq-key wide">Palanca I2</span>
  </div>

</html>
