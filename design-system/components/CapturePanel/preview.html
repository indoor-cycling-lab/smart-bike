<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>CapturePanel</title></head>
<body>
<div class="sq-pad sq-grid sq-gap-3 sq-w-panel">
  <div class="sq-list"><div class="sq-entry"><div class="in"><span class="sq-key wide">Palanca D1</span><span class="gest">pulsar</span></div><button type="button" class="sq-entry__remove" aria-label="Quitar Palanca D1 pulsar"><svg class="sq-icon" aria-hidden="true"><use href="../../icons.svg#i-close"/></svg></button></div><div class="sq-entry"><div class="in"><span class="sq-key wide">Palanca D2</span><span class="gest">pulsar</span></div><button type="button" class="sq-entry__remove" aria-label="Quitar Palanca D2 pulsar"><svg class="sq-icon" aria-hidden="true"><use href="../../icons.svg#i-close"/></svg></button></div></div>
  <div class="sq-capture"><span>Pulsa en el Square el botón o la combinación que quieres usar</span><div class="sq-capture__keys"><span class="sq-caption">Esperando…</span></div></div>
  <div class="sq-capture"><span>Pulsa en el Square el botón o la combinación que quieres usar</span><div class="sq-capture__keys"><span class="sq-key wide down">Campag. D</span><span class="sq-plus">+</span><span class="sq-key down" role="img" aria-label="triángulo"><svg class="sq-icon" aria-hidden="true"><use href="../../icons.svg#i-tecla_triangulo"/></svg></span></div><span class="sq-caption">Detectado: combinación</span></div>
  <div class="sq-capture is-off"><span>Conecta el Square para capturar un botón</span></div>
</div>
</body>
</html>
