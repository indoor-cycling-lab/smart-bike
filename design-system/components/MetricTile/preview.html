<!-- @dsCard group="Rodaje" height=140 subtitle="Potencia, cadencia, pendiente (subida, bajada y llano), potencia objetivo en ERG, sin dato y tamaños md y texto de Diagnóstico" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>MetricTile</title></head>
<body>
<div class="sq-pad sq-row sq-row--end sq-gap-8">
  <div class="sq-metric"><span class="sq-label">Potencia</span><span class="sq-metric-val xl">247<span class="sq-unit">W</span></span></div>
  <div class="sq-metric"><span class="sq-label">Cadencia</span><span class="sq-metric-val lg">91<span class="sq-unit">rpm</span></span></div>
  <div class="sq-metric"><span class="sq-label">Potencia ERG</span><span class="sq-metric-val lg">230<span class="sq-unit">W</span></span><span class="sq-target">objetivo 230 W · −10 con ↓</span></div>
  <div class="sq-metric"><span class="sq-label">Cadencia</span><span class="sq-metric-val lg is-empty" aria-label="Sin dato">—</span></div>
  <div class="sq-metric"><span class="sq-label">Pendiente</span><span class="sq-metric-val lg is-climb">+4,2<span class="sq-unit">%</span></span></div>
  <div class="sq-metric"><span class="sq-label">Pendiente</span><span class="sq-metric-val lg is-descent">−7,0<span class="sq-unit">%</span></span></div>
  <div class="sq-metric"><span class="sq-label">Pendiente</span><span class="sq-metric-val lg">0,0<span class="sq-unit">%</span></span></div>
  <div class="sq-metric"><span class="sq-label">Ajuste marcha</span><span class="sq-metric-val md">+1,5<span class="sq-unit">%</span></span></div>
  <div class="sq-metric"><span class="sq-label">Modelo</span><span class="sq-metric-val text">Simple</span></div>
</div>
</body>
</html>
