<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>GearStepper</title></head>
<body>
<div class="sq-w-panel">
  <div class="sq-step sq-step--gear"><div class="sq-item__text"><span class="sq-gear-name">36×15</span><span class="sq-caption">Relación 2,40</span></div>
    <div class="sq-step-ctl"><button type="button" aria-label="Bajar el ajuste de la 36×15">−</button><span class="sq-step-val">+3,2<span class="sq-unit"> %</span></span><button type="button" aria-label="Subir el ajuste de la 36×15">+</button></div></div>
  <div class="sq-step sq-step--gear" aria-current="true"><div class="sq-item__text"><span class="sq-gear-name">36×17</span><span class="sq-caption">Relación 2,12</span></div>
    <div class="sq-step-ctl"><button type="button" aria-label="Bajar el ajuste de la 36×17">−</button><span class="sq-step-val">+1,0<span class="sq-unit"> %</span></span><button type="button" aria-label="Subir el ajuste de la 36×17">+</button></div></div>
  <div class="sq-step sq-step--gear"><div class="sq-item__text"><span class="sq-gear-name">52×11</span><span class="sq-caption">Relación 4,73 · máximo</span></div>
    <div class="sq-step-ctl"><button type="button" aria-label="Bajar el ajuste de la 52×11">−</button><span class="sq-step-val">+20,0<span class="sq-unit"> %</span></span><button type="button" aria-label="Subir el ajuste de la 52×11" disabled>+</button></div></div>
</div>
</body>
</html>
