<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>PlatformBadge</title></head>
<body>
<div class="sq-pad sq-col sq-w-phone sq-gap-2">
  <div class="sq-ride__platform"><a class="sq-pbadge" href="#" aria-label="Conexión: rodillo, conectado"><span class="sq-conn ok"><span class="dot"></span>Conectado</span></a></div>
  <div class="sq-ride__platform"><a class="sq-pbadge" href="#" aria-label="Conexión: rodillo, conectado; mando, esperando"><span class="sq-conn ok"><span class="dot"></span>Conectado · sin mando</span></a></div>
  <div class="sq-ride__platform"><a class="sq-pbadge" href="#" aria-label="Conexión: rodillo, conectado; pulso, esperando"><span class="sq-conn ok"><span class="dot"></span>Conectado · sin pulso</span></a></div>
  <div class="sq-ride__platform"><a class="sq-pbadge" href="#" aria-label="Conexión: rodillo, conectado; mando, esperando; pulso, esperando"><span class="sq-conn ok"><span class="dot"></span>Conectado · sin mando ni pulso</span></a></div>
  <div class="sq-ride__platform"><a class="sq-pbadge" href="#" aria-label="Conexión: rodillo, esperando"><span class="sq-conn wait"><span class="dot"></span>Esperando conexión…</span></a></div>
  <div class="sq-ride__platform"><a class="sq-pbadge" href="#" aria-label="Conexión: rodillo, no visible en la red"><span class="sq-conn off"><span class="dot"></span>No visible en la red</span></a></div>
  <div class="sq-ride__platform"><a class="sq-pbadge" href="#" aria-label="Conexión: rodillo, sin wifi"><span class="sq-conn off"><span class="dot"></span>Sin wifi</span></a></div>
  <div class="sq-ride__platform"><a class="sq-pbadge" href="#" aria-label="Conexión: sin rodillo configurado, no se publica nada"><span class="sq-conn off"><span class="dot"></span>Sin rodillo</span></a></div>
</div>
</body>
</html>
