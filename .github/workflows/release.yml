# Publica una versión de la app al empujar una etiqueta vX.Y.Z sobre main (change preparar-release, decisión 4):
# comprueba la etiqueta, pasa los tests y los linters, compila la release firmada y crea la Release de GitHub con el
# APK, su SHA-256 y la huella del certificado. Mientras el repositorio sea privado (plan gratuito, sin entornos), los
# secrets son del repositorio; en el repositorio público irán en el entorno «release», limitado a etiquetas v*, y el job
# llevará `environment: release` (docs/desarrollo.md § 7).
name: Publicar una versión

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      ETIQUETA: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Comprobar la etiqueta
        run: |
          if ! [[ "$ETIQUETA" =~ ^v[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "::error::La etiqueta $ETIQUETA no vale: debe tener la forma vX.Y.Z (tres números de hasta 3 cifras), por ejemplo v0.2.0"
            exit 1
          fi
          echo "VERSION=${ETIQUETA#v}" >> "$GITHUB_ENV"

      - name: Comprobar que la etiqueta está en main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::La etiqueta $ETIQUETA no está en main: solo se publica desde main"
            exit 1
          fi

      - name: Comprobar los secrets de firma
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          HUELLA_CERTIFICADO: ${{ vars.HUELLA_CERTIFICADO }}
        run: |
          falta=0
          for v in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD HUELLA_CERTIFICADO; do
            if [ -z "${!v}" ]; then echo "::error::Falta $v (docs/desarrollo.md, «Publicar una versión»)"; falta=1; fi
          done
          exit $falta

      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Preparar la clave
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Comprobar y compilar
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew test :app:testDebugUnitTest ktlintCheck :app:lintRelease :app:assembleRelease -PetiquetaVersion="$ETIQUETA"

      - name: Verificar la firma
        env:
          HUELLA_CERTIFICADO: ${{ vars.HUELLA_CERTIFICADO }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          # El formato de la línea cambia entre versiones de apksigner («Signer #1 …» o «Signer (minSdkVersion=…) …»).
          certificados=$("$apksigner" verify --print-certs "$apk")
          echo "$certificados"
          huella=$(echo "$certificados" | grep -m1 "certificate SHA-256 digest:" | awk '{print $NF}')
          esperada=$(echo "$HUELLA_CERTIFICADO" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -z "$huella" ] || [ "$huella" != "$esperada" ]; then
            echo "::error::La huella del APK ($huella) no es la de HUELLA_CERTIFICADO: no se publica con otra clave"
            exit 1
          fi
          echo "HUELLA=$huella" >> "$GITHUB_ENV"

      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="smart-bike-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          printf 'APK: `%s`\n\nSHA-256 del APK: `%s`\n\nHuella SHA-256 del certificado de firma: `%s`\n\nComprobar: `sha256sum %s` y `apksigner verify --print-certs %s`.\n' \
            "$apk" "$sha" "$HUELLA" "$apk" "$apk" > notas.md
          gh release create "$ETIQUETA" "$apk" --title "$VERSION" --notes-file notas.md --generate-notes

      - name: Borrar la clave
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
